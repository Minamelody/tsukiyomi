<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツキヨミ 無料鑑定ツール</title>
<!--
  ============================================================
  ツキヨミ 無料鑑定ツール（ローカルHTML版・Safari対応）
  Designer: デザイン骨格（深紫×金 VI）
  Engineer: 下記「★Engineer注入点」に実エンジン＋辞書を組み込む

  【Safari file:// 対応のルール】
  - この1ファイルに全てインライン化（外部JS/CSS参照しない）
  - ES modules（import文）は使わない（Safari file:// でブロックされる）
  - フォントはシステムフォントのみ（オフライン）
  実装: 2026-09-08 / R社長 3833441「Safariで開けるように」
  DR要件 (3833448): CLI(line-fortune.js)は温存・本HTMLは同一ロジック/同一辞書で追加・オフライン・決定論
  ============================================================
-->
<style>
  :root {
    --ink: #2b1b4d;        /* 深紫 */
    --ink-deep: #1e1336;
    --gold: #c9a227;       /* 金 */
    --gold-soft: #e6c96b;
    --paper: #f7f3ea;      /* 生成紙 */
    --paper-edge: #e5dcc8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, var(--ink-deep) 0%, var(--ink) 55%, #3a2a63 100%);
    color: var(--paper);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 32px 16px 48px;
    line-height: 1.8;
  }
  .card {
    width: 100%; max-width: 560px;
    background: var(--paper); color: #2a241b;
    border-radius: 14px; padding: 28px 24px 32px;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  .crest { text-align: center; margin-bottom: 6px; }
  .crest svg { width: 44px; height: 44px; }
  h1 {
    text-align: center; font-size: 20px; letter-spacing: .12em;
    color: var(--ink); margin-bottom: 2px;
  }
  .sub {
    text-align: center; font-size: 12.5px; color: #7a6f5c;
    margin-bottom: 22px; letter-spacing: .05em;
  }
  label { display: block; font-size: 13px; color: var(--ink); margin: 14px 0 4px; font-weight: 700; }
  input {
    width: 100%; padding: 10px 12px; font-size: 16px;
    border: 1px solid var(--paper-edge); border-radius: 8px;
    background: #fff; color: #2a241b; outline: none;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,.25); }
  .hint { font-size: 11.5px; color: #8a7f68; margin-top: 3px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button.primary {
    width: 100%; margin-top: 22px; padding: 13px 0; font-size: 16px;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    color: #2a241b; border: none; border-radius: 9px; cursor: pointer;
    font-family: inherit; font-weight: 700; letter-spacing: .08em;
    box-shadow: 0 4px 14px rgba(201,162,39,.4);
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .result-wrap { display: none; margin-top: 20px; }
  .result-wrap.show { display: block; }
  .result-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .count { font-size: 12px; color: #7a6f5c; }
  .count b { color: var(--ink); }
  .count.ok b { color: #1f7a46; }
  .count.warn b { color: #b07a1c; }
  .result {
    background: #fff; border: 1px solid var(--paper-edge); border-radius: 8px;
    padding: 14px 14px; font-size: 14.5px; white-space: pre-wrap;
    min-height: 220px; max-height: 520px; overflow-y: auto; color: #2a241b;
  }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions button {
    flex: 1; padding: 11px 0; font-size: 14px; border-radius: 8px;
    font-family: inherit; cursor: pointer; transition: filter .15s;
  }
  .btn-copy {
    background: var(--ink); color: var(--gold-soft); border: none; font-weight: 700;
  }
  .btn-reset { background: #fff; color: #6a6048; border: 1px solid var(--paper-edge); }
  .actions button:active { filter: brightness(.9); }
  .copied { display:none; text-align:center; font-size:12px; color:#1f7a46; margin-top:8px; }
  .foot { text-align: center; font-size: 11px; color: #8a7f68; margin-top: 22px; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="card">
  <div class="crest">
    <!-- ツキヨミ 三日月（VI） -->
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="20" fill="#c9a227"/>
      <circle cx="31" cy="20" r="17" fill="#f7f3ea"/>
    </svg>
  </div>
  <h1>ツキヨミ 無料鑑定</h1>
  <div class="sub">5つの占いを、1冊の鑑定書に。</div>

  <form id="fortune-form" autocomplete="off">
    <div class="row">
      <div>
        <label for="sei">姓（任意）</label>
        <input id="sei" type="text" placeholder="例: 月読" maxlength="12">
      </div>
      <div>
        <label for="mei">名（任意）</label>
        <input id="mei" type="text" placeholder="例: 未来" maxlength="12">
      </div>
    </div>
    <label for="birthday">生年月日（必須）</label>
    <input id="birthday" type="date" required>
    <div class="hint">生年月日だけで、今の流れが読めます。</div>

    <button type="submit" class="primary" id="run">鑑定する</button>
  </form>

  <div class="result-wrap" id="result-wrap">
    <div class="result-head">
      <div class="count" id="count"></div>
    </div>
    <div class="result" id="result"></div>
    <div class="actions">
      <button type="button" class="btn-copy" id="copy">結果をコピー（LINEへ）</button>
      <button type="button" class="btn-reset" id="reset">やり直す</button>
    </div>
    <div class="copied" id="copied">コピーしました。LINEでそのまま送信できます。</div>
  </div>

  <div class="foot">オフラインで動作します／この端末の外にデータは送信されません</div>
</div>

<script>
'use strict';
/* ============================================================
   ★Engineer注入点（ここだけ差し替え）:
   TsukiyomiLineReport.generate を、実エンジン（5種計算＋辞書合成）に置き換える。
   - 入力: { sei, mei, birthday }  birthday は 'YYYY-MM-DD'
   - 出力: 500〜800字のテキスト（7セクション構成・誘導行1行つき）
   - 決定論: 同じ入力 = 毎回同じ出力
   - 辞書・エンジンはこのファイル内にインラインで埋め込む（外部参照禁止）
   ============================================================ */
/* ==== ENGINE BEGIN（tools/build-line-fortune-html.js で自動生成・手編集禁止） ==== */
var __ns = {};

__ns['./strokes-table'] = (function () {
'use strict';
// 姓名判断の画数表（単一ファイル・ブラウザでもNodeでも同じものを使う）。
//
// 出典と優先順位:
//   1. KANJIDIC2（EDRDG・JIS X 0208/0212/0213 基準・新字体）— 日本の姓名判断はこちらが正
//      （Unihanは中国式の部首画数を返すことがある。陽=Unihan 11画 / JIS 12画、阿=7画 / 8画）
//   2. Unicode Unihan kTotalStrokes — 1に無い字を補完
//      CJK基本ブロック + 互換漢字(U+F900-FAFF) + 拡張B(U+20000-2A6DF)
//      → 髙・濵・舘・嶋・邉・邊・眞・德・﨑・𠮷 などの異体字姓に対応
//   3. STROKE_OVERRIDE — 1も2も日本の姓名判断の慣行と異なる字を明示的に直す
//
// 推定は行わない。旧実装は `4 + (コードポイント % 13)` で推定していたが、
// 画数と何の関係もない値で「咲」を15画（正解9画）と出していた。

  if (!/^\d{4}-\d{2}-\d{2}$/.test(birthday || '')) {
    throw new Error('birthday は YYYY-MM-DD 形式で必須です');
  }
  const [y, m, d] = birthday.split('-').map(Number);
  const name = (sei + mei).trim();

  // 5種エンジン（すべて決定論）
  const seimei = name ? seimeiHandan(sei, mei) : null;
  const jinkaku = (seimei && seimei.kaku && seimei.kaku.人格) ? seimei.kaku.人格.n : null;
  const shichu = shichuMeishiki(birthday);
  const nikkanKan = shichu.nikkan.kan;             // 例: 甲
  const nikkanEl = shichu.nikkan.element;          // 例: 木
  const sun = horoscope(birthday).sun.name;        // 太陽星座
  const cards = draw3(`${name}|${birthday}`);
  const nowCard = cards.find(c => c.position === '現在') || cards[1];

  // 誘導A/B（生年月日のハッシュで決定的に振り分け）
  const guide = (hash(birthday) % 2 === 0) ? GUIDE_A : GUIDE_B;

  // ① 挨拶
  const greet = name
    ? `${name}さん、生まれた日とお名前から、あなたの流れを読みました。`
    : '生まれた日から、あなたの流れを読みました。';

  // ② 姓名判断
  let seimeiSec;
  if (jinkaku == null) {
    seimeiSec = 'お名前（姓と名）を教えていただければ、姓名判断も加えて読めます。';
  } else {
    const nr = numrei(jinkaku);
    const ch = primaryChar(sei, mei);
    seimeiSec = `お名前の中心になる画数は${jinkaku}画。この画数には${nr.nature}の性質があって、${nr.scene}、あなたらしさがよく出るようです。${jigiText(ch)}。名前が示す型は、${nr.type}。急がず、この型のまま進むのが自然な流れです。`;
  }

  // ③ 12星座・西洋占星術
  const zod = ZODIAC[sun];
  const genkyo = GENKYO[moonPhaseKey(birthday)];
  const seizaSec = `${m}月${d}日生まれのあなたの太陽は${sun}。${zod.nature}ことを大切にする、${zod.word}のような人として映ります。今のあなたは${genkyo}の流れの中にいて、繰り返し浮かぶ考えが、答えの形をやわらかく変えているようです。生まれた時刻・場所をいただけると、上昇星座まで読めます。`;

  // ④ 四柱推命
  const gy = GOGYO[nikkanEl];
  const gesshi = monthElement(y, m);
  const shichuSec = `あなたの日干は${nikkanKan}（${nikkanEl}）。${gy.nature}の持ち味を持つ日干で、${gy.scene}に力を発揮しやすいようです。今は${gesshi}の気が強く、${gy.rec1}よりも${gy.rec2}を進めるのが、流れに合っているように見えます。`;

  // ⑤ タロット
  const tv = TAROT[nowCard.card] || TAROT['愚者'];
  const tarotSec = `いまのあなたの1枚は、${nowCard.card}（${nowCard.orientation}）。${tv.brief}。急がず、${tv.advice}を選ぶのが、自然な流れのようです。`;

  // ⑥ 運気の流れ（生まれ月の暦スキャン・決定論）
  const unkiSec = buildUnkiSec(y, m);

  const sections = [
    { head: null, body: greet },
    { head: '姓名判断', body: seimeiSec },
    { head: '12星座・西洋占星術', body: seizaSec },
    { head: '四柱推命', body: shichuSec },
    { head: 'タロット', body: tarotSec },
    { head: '運気の流れ', body: unkiSec },
    { head: null, body: guide },
  ];

  const text = sections
    .map(s => (s.head ? `【${s.head}】\n${s.body}` : s.body))
    .join('\n\n');

  return { text, sections, checks: qaCheck(text, sections) };
}

// ── 回帰QA 5点 ───────────────────────────────────────────────────────────
function qaCheck(text, sections) {
  const fails = [];
  const len = text.length;
  if (len < 500 || len > 800) fails.push(`字数 ${len}（500〜800外）`);
  for (const name of ['姓名判断', '四柱推命', 'タロット', '12星座', '西洋占星術']) {
    if (!text.includes(name)) fails.push(`5種要素名「${name}」が存在しない`);
  }
  for (const w of FORBIDDEN) {
    if (text.includes(w)) fails.push(`禁止語「${w}」が含まれる`);
  }
  if (/\{[^{}]+\}/.test(text)) fails.push('プレースホルダー {…} 残留');
  const bodies = sections.filter(s => s.body === GUIDE_A || s.body === GUIDE_B);
  if (bodies.length !== 1) fails.push(`誘導行が末尾に1行でない（${bodies.length}件）`);
  const last = sections[sections.length - 1];
  if (last.body !== GUIDE_A && last.body !== GUIDE_B) fails.push('末尾が誘導行でない');
  return { len, ok: fails.length === 0, fails };
}

return { buildReport, qaCheck, ZODIAC, TAROT, JIGI, GENKYO, FORBIDDEN };
})();

    // 同一入力 = 同一出力（決定論）。抽出元: docs/line-fortune.html の ENGINE ブロック。
    return __ns['./line-fortune'].buildReport(input).text;
  }
};
/* ============================================================
   UIロジック（変更不要・そのまま動く）
   ============================================================ */
(function () {
  const form = document.getElementById('fortune-form');
  const wrap = document.getElementById('result-wrap');
  const out = document.getElementById('result');
  const count = document.getElementById('count');
  const copied = document.getElementById('copied');
  const runBtn = document.getElementById('run');

  function fmtBirthday(v) {
    if (!v) return '';
    const p = v.split('-');
    return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
  }

  function showCount(n) {
    const el = count;
    el.innerHTML = '出力 <b>' + n + '</b> 字';
    el.className = 'count' + (n >= 500 && n <= 800 ? ' ok' : (n < 500 ? ' warn' : ''));
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const birthday = document.getElementById('birthday').value;
    if (!birthday) return;
    const sei = document.getElementById('sei').value.trim();
    const mei = document.getElementById('mei').value.trim();
    const text = TsukiyomiLineReport.generate({ sei: sei, mei: mei, birthday: birthday });
    out.textContent = text;
    showCount(text.length);
    wrap.classList.add('show');
    copied.style.display = 'none';
    runBtn.disabled = true;
  });

  document.getElementById('reset').addEventListener('click', function () {
    form.reset();
    wrap.classList.remove('show');
    runBtn.disabled = false;
    copied.style.display = 'none';
    document.getElementById('sei').focus();
  });

  document.getElementById('copy').addEventListener('click', function () {
    const t = out.textContent;
    function done() { copied.style.display = 'block'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(); });
    } else { fallbackCopy(); }
    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (err) {}
      document.body.removeChild(ta);
    }
  });

  ['sei', 'mei', 'birthday'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      runBtn.disabled = false;
      copied.style.display = 'none';
    });
  });
})();
