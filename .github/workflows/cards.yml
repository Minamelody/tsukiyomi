# 翌日分の投稿カードを生成して Pages で配信する。
#
# Threads API は画像に公開URLを要求するので、カードは投稿より先に配信されていないと
# 画像付き投稿にできない。投稿時に push→ビルド待ちを挟むとビルドの遅延や失敗が
# そのまま投稿の失敗になるため、前日に配信まで済ませておく。
#
# 生成物は dist/cards/<date>/ に置く（Pages が配信するのは dist/ 配下だけ）。
# コミットすると pages.yml が push で走り、配信まで自動で進む。

name: Generate tomorrow's post cards

on:
  schedule:
    # 22:00 JST = 13:00 UTC（前日のうちに翌日分を用意する）
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '生成する日付（YYYY-MM-DD、空なら翌日JST）'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

# pages.yml と同じ Pages デプロイを行うので、同じグループに入れて直列化する。
# 別グループだと同時に走ってデプロイが競合し、古い dist で上書きされうる。
# cancel-in-progress は false: カード生成の途中キャンセルはコミット漏れになる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Noto CJK fonts
        # カード描画に必須。無いと日本語が豆腐になる（gen_post_cards.py --check-env で検査）
        run: |
          sudo apt-get update -qq
          # Light/DemiLight は fonts-noto-cjk ではなく -extra 側に入っている。
          # gen_post_cards.py はロゴと数字に Light を使うので extra が必須。
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji

      - name: Font preflight
        run: python3 design/cards/gen_post_cards.py --check-env

      - name: Generate cards
        run: node tools/gen-tomorrow-cards.js ${{ github.event.inputs.date }}

      - name: Commit and push
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/cards
          if git diff --cached --quiet; then
            echo "変更なし（同じカードが既にある）"
            exit 0
          fi
          # 手動実行で日付を指定した場合もあるので、実際に置かれたディレクトリ名を使う
          days=$(ls dist/cards | tr '\n' ' ')
          git commit -m "Add post cards ($days)"
          git push

      # GITHUB_TOKEN による push は他のワークフローを起動しない（GitHub の仕様。
      # 無限ループ防止のため）。つまり上の push では pages.yml が走らず、カードは
      # 永久に404のまま＝画像付き投稿に一度も切り替わらない。
      # そのためデプロイをここで完結させる。
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site with the cards included
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REQUIRE_SHOP_URLS: '1'
          COCONALA_PROFILE_URL: ${{ vars.COCONALA_PROFILE_URL }}
          COCONALA_URL_SEIMEI: ${{ vars.COCONALA_URL_SEIMEI }}
          COCONALA_URL_SEIZA: ${{ vars.COCONALA_URL_SEIZA }}
          COCONALA_URL_TAROT: ${{ vars.COCONALA_URL_TAROT }}
          COCONALA_URL_SHICHU: ${{ vars.COCONALA_URL_SHICHU }}
          COCONALA_URL_ASTRO: ${{ vars.COCONALA_URL_ASTRO }}
          COCONALA_URL_BUNDLE: ${{ vars.COCONALA_URL_BUNDLE }}
        run: node tools/build-static.js

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html がありません"; exit 1; }
          grep -q 'rel="canonical"' dist/index.html || { echo "canonical が出力されていません"; exit 1; }
          ls dist/cards/*/ >/dev/null || { echo "dist/cards が空です"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: cards
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
